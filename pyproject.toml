[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preset"
version = "1.0.1"
description = "PRESET: Differential Expression Analysis of Bulk RNA-seq with a Prior-Fitted Network Trained Across Experiments"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jaeyeon Jang" }, { name = "Inuk Jung" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "torch>=2.1"]

[project.optional-dependencies]
anndata = ["anndata>=0.10"]
plot = ["matplotlib>=3.7", "umap-learn>=0.5"]
tutorial = ["matplotlib>=3.7", "umap-learn>=0.5", "scikit-learn>=1.2", "jupyterlab>=4"]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/wodus1035/PRESET"

[project.scripts]
preset = "preset.cli:main"

[tool.setuptools]
packages = ["preset"]

[tool.setuptools.package-data]
preset = ["weights/*.pt"]
